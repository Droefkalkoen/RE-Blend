# Development tooling only. RE-Blend is not pip-installed into Blender — it is
# packaged as a Blender extension via reblend/blender_manifest.toml (the manifest
# lives beside reblend/__init__.py, as Blender's extension system requires). This
# file exists so the Blender-independent layers (reblend/project/…) can be
# developed and tested with plain CPython.

[project]
name = "re-blend"
version = "0.1.0"
description = "Blender extension for Reason Rack Extension GUI sprite-sheet production"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    # Bundled as a wheel in the Blender extension; a plain dependency here.
    "lupa>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Ships with Blender (§8); a dev dependency here so the render layer's
    # pure-numpy stitcher/validators are testable in plain CPython.
    "numpy>=1.24",
]
# RE Bench PNG screenshots (``rebench render``, the MCP ``view_render`` tool)
# drive a headless Chromium; SVG output and everything else need no extra.
screenshots = ["playwright>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = [
    "reblend",
    "reblend.project",
    "reblend.model",
    "reblend.render",
    "reblend.ui",
    "rebench",
]

[tool.setuptools.package-data]
rebench = ["static/*.html"]

[project.scripts]
rebench = "rebench.cli:main"
