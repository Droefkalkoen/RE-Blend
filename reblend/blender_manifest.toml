schema_version = "1.0.0"

# RE-Blend — Rack Extension GUI sprite-sheet production from Blender.
# Design: Blender_RE_Plugin_Design.md (§8: Blender 4.2 LTS+ extension, pure Python).

id = "reblend"
version = "0.1.0"
name = "RE-Blend"
tagline = "Sprite-sheet production for Reason Rack Extension GUIs"
maintainer = "droefkalkoen <ephexdesign@gmail.com>"
type = "add-on"

website = "https://github.com/Droefkalkoen/RE-Blend"

tags = ["Render", "Pipeline"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

# The lupa wheels (sandboxed Lua interpreter for reading the RE project's
# GUI2D/*.lua files, design §6.4) are added at packaging time by
# tools/package.py, which writes `platforms` and `wheels` into a staged copy of
# this file, one zip per platform. Kept out of this copy so a linked source
# folder still loads. numpy ships with Blender and is not bundled.

[permissions]
files = "Read and write the RE project's sprite sheets and layout Lua"
